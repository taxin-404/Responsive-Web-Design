name: Update gallery

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate projects.json
        run: node scripts/build-gallery.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- projects.json; then
            echo "projects.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "chore: regenerate projects.json"
          git push
